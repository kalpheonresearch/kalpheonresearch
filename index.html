<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalpheon Research</title>
<meta name="description" content="Kalpheon Daily Report. 매크로와 사이클을 통합한 일간 리서치 노트 / Integrated macro and cycle daily research note">
<link rel="canonical" href="https://kalpheonresearch.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kalpheon Research">
<meta property="og:title" content="Kalpheon Research">
<meta property="og:description" content="매크로와 사이클을 통합한 일간 리서치 노트 / Integrated macro and cycle daily research note">
<meta property="og:url" content="https://kalpheonresearch.com/">
<meta property="og:image" content="https://kalpheonresearch.com/reports/og/latest.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://kalpheonresearch.com/reports/og/latest.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#0F1E33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@500&family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1E33; --ink-2:#3A4A63; --muted:#5F6673; --rule:#E7E3D8; --canvas:#FCFCFB; --wash:#F7F6F2;
  --gold:#B8975A; --gold-ink:#8A6B2F; --gold-bg:#F6F0E4;
  --red:#A13D2E; --amber:#8A6A1E; --green:#2F6650;
  --serif:'Noto Serif KR',Georgia,serif; --sans:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
html.kp-wait body{visibility:hidden;}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.wrap{max-width:1000px;margin:0 auto;padding:0 22px;}
a{color:inherit;}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
[id]{scroll-margin-top:64px;}

/* top */
header.top{border-bottom:1px solid var(--rule);padding:22px 0 14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px 18px;}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;}
.brand svg{width:32px;flex:none;}
.bw{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;letter-spacing:.14em;font-size:19px;line-height:1;}
.bs{font-family:'Jost',sans-serif;font-weight:500;letter-spacing:.38em;font-size:9px;color:var(--gold-ink);margin-top:4px;}
nav.nav{display:flex;gap:2px;order:3;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
nav.nav::-webkit-scrollbar{display:none;}
nav.nav a{flex:none;display:inline-flex;align-items:center;min-height:44px;padding:0 14px 0 0;font-size:13.5px;font-weight:600;color:var(--ink-2);text-decoration:none;}
nav.nav a:hover{color:var(--gold-ink);}
nav.nav a.hasnew{position:relative;padding-right:30px;}
.newb{position:absolute;top:5px;right:3px;font-family:'Jost',var(--sans);font-weight:500;font-size:8.5px;letter-spacing:.06em;line-height:1;padding:3px 5px 2px;border-radius:8px;background:var(--gold-ink);color:#fff;pointer-events:none;}
@media (min-width:760px){nav.nav{order:0;width:auto;margin-left:auto;margin-right:6px;}nav.nav a{padding:0 12px;}nav.nav a.hasnew{padding-right:32px;}.newb{right:5px;}}
.lang{display:inline-flex;border:1px solid var(--rule);border-radius:22px;overflow:hidden;background:#fff;}
.lang button{border:0;background:none;min-width:48px;min-height:40px;padding:0 14px;font:inherit;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;line-height:1;}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff;}
.lang button:not([aria-pressed="true"]):hover{background:var(--gold-bg);color:var(--ink);}
.lang button:focus-visible{outline-offset:-3px;}

.intro{margin:22px 0 0;font-size:13.5px;color:var(--ink-2);max-width:620px;}

/* sticky mini header */
.mini{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--ink);color:#fff;padding-top:env(safe-area-inset-top,0px);transform:translateY(-110%);transition:transform .18s ease;box-shadow:0 1px 0 rgba(255,255,255,.14);}
.mini.on{transform:none;}
@media (prefers-reduced-motion:reduce){.mini{transition:none;}}
.mini-in{display:flex;align-items:center;gap:14px;height:48px;}
.mini-in svg{width:24px;height:24px;flex:none;}
.mini-lv{font-family:var(--serif);font-weight:700;font-size:16px;}
.mini-lv.safe{color:#8CCBA8;}.mini-lv.caution{color:#E7C07A;}.mini-lv.danger{color:#F0907F;}
.mini-p{font-size:13px;color:#E6D6AE;font-weight:600;}
.mini-d{margin-left:auto;font-size:12px;color:#AEB9CB;}

/* hero */
.latest{color:#fff;background:var(--ink);border-radius:6px;padding:24px 26px 26px;margin-top:20px;}
.lhead{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#AEB9CB;margin-bottom:16px;}
.lhead b{color:#E6D6AE;font-weight:600;}
.hgrid{display:grid;grid-template-columns:1.05fr 1fr;gap:28px 36px;align-items:start;}
@media (max-width:820px){.hgrid{grid-template-columns:1fr;}}
.k{font-size:12px;color:#AEB9CB;margin-bottom:2px;}
.k.gkl{font-size:13px;font-weight:600;color:#E6D6AE;margin-bottom:8px;}
.gauge-h{display:block;width:100%;max-width:280px;height:auto;}
.gnum{font-family:var(--serif);font-weight:700;font-size:54px;fill:#fff;}
.glv{font-family:var(--serif);font-weight:700;font-size:19px;}
.glv.green{fill:#8CCBA8;}.glv.amber{fill:#E7C07A;}.glv.red{fill:#F0907F;}
.gtick{font-size:11px;fill:#AEB9CB;}
.gdelta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:12px;}
.klink{font-size:12.5px;color:#E6D6AE;text-decoration:underline;text-underline-offset:3px;}
.klink:hover{color:#fff;}
.hlrow{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px;}
.lvw{font-family:var(--serif);font-weight:700;font-size:60px;line-height:1.08;}
.lvw.green{color:#8CCBA8;}.lvw.amber{color:#E7C07A;}.lvw.red{color:#F0907F;}
.sc{font-size:22px;color:#E6D6AE;font-weight:500;}
.sc small{font-size:13px;color:#AEB9CB;margin-left:2px;}
.chip{font-size:12px;font-weight:600;padding:3px 11px;border-radius:20px;background:rgba(255,255,255,.1);color:#E4E8F0;}
.chip.up{color:#F0907F;background:rgba(240,144,127,.14);}.chip.down{color:#8CCBA8;background:rgba(140,203,168,.14);}
@media (max-width:520px){.lvw{font-size:46px;}.latest{padding:20px 18px 22px;}}
.oneline{margin:12px 0 0;font-size:16px;line-height:1.7;color:#E4E8F0;max-width:520px;}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;}
a.cta,button.ghost{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:4px;font:inherit;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer;}
a.cta{background:var(--gold);color:var(--ink);border:0;transition:background .15s;}
a.cta:hover{background:#C9A96B;}
a.cta svg{width:16px;height:16px;transition:transform .15s;}
a.cta:hover svg{transform:translateX(3px);}
button.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.38);font-size:14px;font-weight:600;padding:0 18px;}
button.ghost:hover{background:rgba(255,255,255,.1);}
@media (max-width:520px){a.cta{flex:1 1 100%;}button.ghost{flex:1 1 auto;}}
.ppanel{padding:16px 18px;border-radius:8px;background:rgba(255,255,255,.07);}
.pr{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.pbig{font-family:var(--serif);font-weight:700;font-size:26px;}
.ptrack{position:relative;height:8px;border-radius:4px;background:#2C3E5C;margin:16px 0 12px;}
.pband{position:absolute;top:0;bottom:0;background:#C9B98A;}
.pmark{position:absolute;top:-4px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;border:3px solid var(--ink);}
.pfoot{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:#AEB9CB;}
.pfoot span:first-child{color:#E6D6AE;}
.sigs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:18px;text-align:center;}
@media (max-width:520px){.sigs{grid-template-columns:repeat(4,1fr);row-gap:14px;}}
.sg i{display:block;width:13px;height:13px;border-radius:50%;margin:0 auto 6px;}
.sg i.red{background:#D9594A;}.sg i.yellow{background:#D4A64A;}.sg i.green{background:#4FA37E;}
.sg b{display:block;font-size:13px;font-weight:600;}
.sg span{display:block;font-size:11px;color:#AEB9CB;}
.falsify{margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,255,255,.16);font-size:13.5px;line-height:1.75;color:#E4E8F0;}
.falsify strong{display:block;font-size:12px;color:#C9B98A;font-weight:600;margin-bottom:2px;}
.lfoot{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:16px;}
.warn{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border:1px solid rgba(231,192,122,.45);border-radius:20px;font-size:12px;color:#E7C07A;font-weight:600;}
.warn::before{content:"";width:6px;height:6px;border-radius:50%;background:#E7C07A;flex:none;}
.tag{display:inline-block;margin-left:6px;padding:0 7px;border:1px solid var(--rule);border-radius:10px;font-size:11px;font-weight:500;color:var(--muted);}
.lhead .tag{border-color:rgba(255,255,255,.3);color:#AEB9CB;}

/* blocks */
section.blk{padding:38px 0 6px;}
section.blk > h2{font-family:var(--serif);font-size:19px;margin:0 0 4px;padding-top:12px;border-top:2px solid var(--ink);}
section.blk > .lead{font-size:12.5px;color:var(--muted);margin:0 0 16px;max-width:640px;}
section.contact{padding-bottom:10px;}
a.mailbtn{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 20px;border:1px solid var(--ink);border-radius:24px;background:#fff;color:var(--ink);font-size:14px;font-weight:600;text-decoration:none;word-break:break-all;}
a.mailbtn:hover{background:var(--ink);color:#fff;}
a.mailbtn svg{width:18px;height:18px;flex:none;}
h3.sub{font-family:var(--serif);font-size:15px;margin:22px 0 8px;}
.near{margin-top:26px;padding:20px 22px 18px;background:#FCFAF5;border:1px solid #EAE5D8;border-radius:12px;}
.near h3{margin:0 0 4px;font-family:var(--serif);font-size:16px;}
.near p.note{margin:0;font-size:12px;color:var(--muted);max-width:560px;}
.ng{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px;}
.ngc{text-align:center;}
.ngn{font-size:12.5px;color:var(--ink-2);}
.ngv{font-size:24px;font-weight:500;line-height:1.3;margin:2px 0 10px;}
.gauge{position:relative;height:176px;width:56px;margin:0 auto;}
.gz{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;}
.gz i{display:block;}
.gz .zr{height:9.09%;background:#E2806F;}
.gz .zo{height:9.09%;background:#EDA66B;}
.gz .zy{height:18.18%;background:#F0D27E;}
.gz .zg{flex:1;background:#9CCFB0;}
.gm{position:absolute;left:-7px;right:-7px;height:3px;margin-bottom:-1.5px;background:var(--ink);border-radius:2px;}
.gd{position:absolute;left:50%;width:10px;height:10px;margin:0 0 -5px -5px;background:var(--ink);border-radius:50%;}
.ngr{font-size:12px;color:var(--muted);margin-top:10px;}
.ngd{font-size:14px;font-weight:600;margin:2px 0 6px;}
.ngs{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;}
.ngs.g{background:#DDEFE4;color:#245A41;}
.ngs.y{background:#FBF0CC;color:#6E5410;}
.ngs.o{background:#FBE5D2;color:#8A4210;}
.ngx{margin:10px auto 0;max-width:210px;font-size:11.5px;line-height:1.6;color:var(--muted);text-align:left;}
.nlg{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;margin-top:20px;font-size:11.5px;color:var(--muted);}
.nlg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;}
@media (max-width:400px){.ngv{font-size:20px;}.near{padding:18px 14px 16px;}}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:22px;overflow:hidden;background:#fff;margin-bottom:12px;}
.seg button{border:0;background:none;min-height:40px;padding:0 16px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;}
.chart{border:1px solid var(--rule);border-radius:8px;background:#fff;padding:12px 10px 8px;}
.chart svg{display:block;width:100%;height:auto;}
.chart text{font-family:var(--sans);}
.cap{font-size:12px;color:var(--muted);margin:8px 2px 0;}
table.sc2{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px;}
table.sc2 th,table.sc2 td{padding:11px 4px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top;}
table.sc2 th{font-weight:500;color:var(--ink-2);}
table.sc2 td{text-align:right;font-weight:700;white-space:nowrap;}
.agrid{display:grid;grid-template-columns:330px 1fr;gap:30px;align-items:start;}
@media (max-width:820px){.agrid{grid-template-columns:1fr;}}
.calh{display:flex;align-items:center;justify-content:space-between;}
.calh button{width:44px;height:44px;border:0;background:none;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center;border-radius:8px;}
.calh button:hover:not(:disabled){background:var(--gold-bg);}
.calh button:disabled{opacity:.3;cursor:default;}
.calh b{font-family:var(--serif);font-size:16px;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.cal .wd{font-size:11.5px;color:var(--muted);padding:4px 0;}
.cal .d{min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;font-size:13.5px;color:#767B86;text-decoration:none;}
.cal a.d{color:var(--ink);font-weight:700;}
.cal a.d:hover{background:var(--gold-bg);}
.cal a.d::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold);margin-top:3px;}
.cal a.d.cur{background:var(--ink);color:#fff;}
.cal a.d.cur::after{background:#C9B98A;}
.legend{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:12px;color:var(--muted);}
.legend::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);}
a.row{display:grid;grid-template-columns:110px 1fr auto 16px;gap:12px;align-items:center;padding:13px 0;min-height:48px;border-bottom:1px solid var(--rule);text-decoration:none;font-size:13px;}
a.row:hover .rd{color:var(--gold-ink);}
.rd{font-family:var(--serif);font-weight:600;}
.rs{color:var(--ink-2);}
.lvt{font-weight:700;}.lvt.red{color:var(--red);}.lvt.amber{color:var(--amber);}.lvt.green{color:var(--green);}
.rp{color:var(--muted);font-size:12px;white-space:nowrap;}
.chev{color:var(--gold);font-size:20px;line-height:1;text-align:right;}
@media (max-width:560px){a.row{grid-template-columns:96px 1fr 16px;}.rp{display:none;}}
button.more{margin-top:14px;background:none;border:1px solid var(--rule);border-radius:3px;min-height:44px;padding:0 18px;font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer;}
button.more:hover{border-color:var(--gold);}
.state{margin-top:18px;padding:26px 22px;border:1px dashed var(--rule);border-radius:4px;color:var(--ink-2);font-size:13.5px;}
.state b{display:block;font-family:var(--serif);font-size:15px;color:var(--ink);margin-bottom:4px;}

/* about / method */
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px 40px;}
@media (max-width:760px){.two{grid-template-columns:1fr;}}
.prose p{margin:0 0 12px;font-size:13.5px;line-height:1.85;color:var(--ink-2);max-width:620px;}
.prose b{color:var(--ink);}
.formula{margin:8px 0 14px;padding:14px 16px;background:var(--wash);border-radius:8px;}
.formula .f{font-family:var(--serif);font-weight:700;font-size:15px;line-height:1.7;}
.formula .n{font-size:12.5px;color:var(--ink-2);line-height:1.8;margin-top:6px;}
.tblwrap{overflow-x:auto;}
table.th{width:100%;border-collapse:collapse;font-size:12.5px;}
table.th th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;border-bottom:1px solid var(--ink);padding:0 8px 7px 0;}
table.th td{padding:9px 6px 9px 0;border-bottom:1px solid var(--rule);color:var(--ink-2);}
table.th td:first-child{font-weight:600;color:var(--ink);}
.disclaimer{margin:38px 0 4px;padding:16px 18px;border:1px solid var(--rule);background:var(--gold-bg);border-radius:4px;font-size:12px;color:var(--ink-2);line-height:1.8;}
.disclaimer strong{color:var(--ink);}
.disclaimer p{margin:0 0 8px;}
.disclaimer p:last-child{margin:0;}
footer{border-top:1px solid var(--rule);margin-top:18px;padding:18px 0 26px;font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.wkb{display:inline-block;margin-right:8px;padding:0 8px;border-radius:10px;background:var(--gold-bg);color:var(--gold-ink);font-size:11px;font-weight:700;white-space:nowrap;}
.cal a.d.wk::after{background:var(--ink-2);}
.legend.wkl{margin-top:4px;}
.legend.wkl::before{background:var(--ink-2);}
</style>
</head>
<body>
<div class="mini" id="mini" aria-hidden="true">
  <div class="wrap mini-in">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M36 24V76M36 52L68 24M48 45L69 76" stroke="#F7F4EC" stroke-width="7" fill="none"/></svg>
    <span class="mini-lv" id="miniLv"></span>
    <span class="mini-p" id="miniP"></span>
    <span class="mini-d" id="miniD"></span>
  </div>
</div>

<div class="wrap" id="top">

  <header class="top">
    <a class="brand" href="#top" id="brandLink">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#0F1E33" stroke-width="4"/><path d="M37 26V74M37 52L66 26M49 47L68 74" stroke="#0F1E33" stroke-width="8" fill="none"/></svg>
      <div><div class="bw">KALPHEON</div><div class="bs">RESEARCH</div></div>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ko" aria-pressed="false">KO</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <p class="intro" id="intro"></p>
  <div id="latest"></div>
  <div id="nearBox"></div>

  <section class="blk" id="trend" hidden>
    <h2 id="trendTitle"></h2>
    <p class="lead" id="trendLead"></p>
    <div class="seg" role="group" id="seg">
      <button type="button" data-k="p" aria-pressed="true"></button>
      <button type="button" data-k="score" aria-pressed="false"></button>
    </div>
    <div class="chart" id="chart"></div>
    <p class="cap" id="chartCap"></p>
  </section>

  <section class="blk" id="archive" hidden>
    <h2 id="archTitle"></h2>
    <p class="lead" id="archLead"></p>
    <div class="agrid">
      <div>
        <div class="calh">
          <button type="button" id="calPrev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
          <b id="calTitle"></b>
          <button type="button" id="calNext"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
        <div class="cal" id="cal"></div>
        <div class="legend" id="legend"></div>
        <div class="legend wkl" id="legendWk" hidden></div>

    $('copy').textContent = T('copy'); $('fnote').textContent = T('fnote');
    Array.prototype.forEach.call(document.querySelectorAll('.lang button'), function (bt) { bt.setAttribute('aria-pressed', bt.getAttribute('data-lang') === lang ? 'true' : 'false'); });
    var ab = $('about'); ab.innerHTML = '';
    ab.appendChild(el('h2', null, T('aboutT')));
    var pr = el('div', 'prose'); pr.innerHTML = T('about');
    if (ABOUT.name) { var np = el('p'); np.appendChild(el('b', null, lang === 'ko' ? '운영자' : 'Author')); np.appendChild(document.createTextNode(' ' + ABOUT.name)); pr.insertBefore(np, pr.firstChild); }
    if (ABOUT.contactUrl) { var cp = el('p'); var ca = el('a', null, ABOUT.contactLabel || ABOUT.contactUrl); ca.href = ABOUT.contactUrl; ca.rel = 'noopener'; cp.appendChild(document.createTextNode(T('contact') + ': ')); cp.appendChild(ca); pr.appendChild(cp); }

    ab.appendChild(lg);
    var me = $('method'); me.innerHTML = '';

  function render() {
    statics();
    var list = $('list'); clear(list); shown = 0;
    $('nearBox').innerHTML = '';
    var arch = $('archive');
    if (state === 'loading') { box(T('loadT'), T('loadB')); $('trend').hidden = true; arch.hidden = true; return; }
    if (state === 'error') { box(T('errT'), T('errB')); $('trend').hidden = true; arch.hidden = true; return; }
    if (!rows.length) { box(T('emptyT'), T('emptyB')); $('trend').hidden = true; arch.hidden = true; return; }
    var all = allRows(), top = all[0];
    hero(top, all[1], top.wk ? wkView(top) : null); near(rows[0]);
    trend();
    rest = all.slice(1); arch.hidden = false; calendar();
    if (rest.length) { more(); } else { $('more').hidden = true; }
  }

  Array.prototype.forEach.call(document.querySelectorAll('.lang button'), function (bt) {
    bt.addEventListener('click', function () {
      lang = bt.getAttribute('data-lang');
      try { localStorage.setItem('kp_lang', lang); } catch (x) {}
      render();
    });
  });
  Array.prototype.forEach.call($('seg').children, function (bt) { bt.addEventListener('click', function () { trendKey = bt.getAttribute('data-k'); trend(); }); });
  $('calPrev').addEventListener('click', function () { var y = Number(calYM.slice(0, 4)), m = Number(calYM.slice(5, 7)) - 1; if (!m) { m = 12; y--; } calYM = y + '-' + (m < 10 ? '0' + m : m); calendar(); });
  $('calNext').addEventListener('click', function () { var y = Number(calYM.slice(0, 4)), m = Number(calYM.slice(5, 7)) + 1; if (m > 12) { m = 1; y++; } calYM = y + '-' + (m < 10 ? '0' + m : m); calendar(); });
  $('more').addEventListener('click', more);
  var rz = null, lastW = 0;
  window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { var w = $('chart').clientWidth; if (state === 'ready' && w && w !== lastW) { lastW = w; trend(); } }, 150); });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (es) { $('mini').classList.toggle('on', !es[0].isIntersecting && state === 'ready'); }).observe($('latest'));
  }

  // 언어 결정: 1) 상단 KO/EN 선택(kp_lang) 2) 접속 국가(한국이면 한글, 그 외 영어) 3) 브라우저 언어
  function browserLang() { return /^ko/i.test(navigator.language || '') ? 'ko' : 'en'; }
  var pref = null; try { pref = localStorage.getItem('kp_lang'); } catch (x) {}
  var geoDone = false, dataDone = false;
  function go() { if (geoDone && dataDone) render(); }
  lang = pref === 'ko' || pref === 'en' ? pref : browserLang();
  render();
  if (pref === 'ko' || pref === 'en') { geoDone = true; }
  else { kpCountry(function (cc) { lang = cc ? (cc === 'KR' ? 'ko' : 'en') : browserLang(); geoDone = true; go(); }); }
  var wkP = fetch('reports/weekend/index.json', { cache: 'no-cache' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (m) { wrows = m && m.reports ? m.reports.filter(ok).map(function (e) { e.wk = true; return e; }) : []; })
    .catch(function () { wrows = []; });
  fetch('reports/index.json', { cache: 'no-cache' })
    .then(function (r) { if (r.status === 404) return null; if (!r.ok) throw new Error('load'); return r.json(); })
    .then(function (m) { rows = m && m.reports ? m.reports.filter(ok).sort(function (a, b) { return a.date < b.date ? 1 : -1; }) : []; state = 'ready'; })
    .catch(function () { state = 'error'; })
    .then(function () { return wkP; })
    .then(function () { dataDone = true; go(); });
})();
